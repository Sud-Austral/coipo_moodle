terceros:
  descripcion: "1.320 de los 1.347 archivos del repositorio son codigo de terceros arrastrado bajo plugins/. No son lo que este proyecto hace y no se sellan uno a uno. Se nombran sus manifiestos y sus archivos de version, que son los que permiten identificar que se arrastro y en que version."
  manifiestos:
    - plugins/admin/tool/mergeusers/composer.json
    - plugins/admin/tool/mergeusers/Makefile
    - plugins/blocks/configurable_reports/composer.json
    - plugins/blocks/configurable_reports/lib/pChart2/composer.json
    - plugins/mod/customcert/composer.json
  archivos_de_version:
    - plugins/admin/tool/mergeusers/version.php
    - plugins/blocks/configurable_reports/version.php
    - plugins/mod/customcert/version.php
    - plugins/theme/academi/version.php
    - plugins/theme/boost_magnific/version.php

notas:
  - "El repositorio es publico segun la evidencia de origen. Los tres documentos propios cuyo contenido no entro en la evidencia y que mas riesgo tienen son [docs/entrevista-avance.md], [docs/MIGRACION.md] y [docs/TRASLADO.md]: hay que leerlos antes de dar por cerrado este manifiesto."
  - "Ningun archivo se marco con contiene_pii confirmado, porque la evidencia no permite confirmarlo en ningun caso. Si alguno se confirma, puede_versionarse pasa a false y la ruta tiene que quedar excluida del control de versiones anclada con barra inicial en [.gitignore]. Comprobarlo corresponde al informe; editar ese archivo no corresponde aqui."
  - "La extraccion automatica de variables de entorno devolvio cero resultados en todo el repositorio. No significa que no haya variables: significa que el analizador no las vio. Es la mayor ceguera de este analisis."
