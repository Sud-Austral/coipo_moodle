# Vhost de Nginx para el Moodle de CONAF — academia.conaf.cl
#
# Copia de referencia de /etc/nginx/sites-available/academia.conaf.cl.conf en el
# servidor 172.31.2.41. NO lo despliega este repositorio: se versiona aquí para
# que no se pierda y para poder detectar divergencias.
#
# Sincronizado el 30-07-2026. Los otros dos vhosts del servidor
# (coipo_prensa2.conf, iam.conaf.cl.conf) siguen exactamente este mismo patrón:
# bloque activo en HTTP + plantilla HTTPS comentada dentro del mismo archivo.
#
# APP_PORT=8115. Sin SSL todavía: pendiente el certificado *.conaf.cl.

server {
    listen 80;
    # La IP permite entrar antes de que exista el DNS. Ojo: Moodle solo admite
    # UNA url canónica ($CFG->wwwroot) — ver la nota al final del archivo.
    server_name academia.conaf.cl 172.31.2.41;

    access_log /var/log/nginx/academia.access.log;
    error_log  /var/log/nginx/academia.error.log;

    # 200m para acompañar a upload_max_filesize/post_max_size de docker/php.ini.
    # Con el 25m habitual, los paquetes SCORM y los respaldos .mbz de curso
    # fallan con un 413 que no deja rastro en los registros de Moodle.
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8115;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Moodle compara este header contra wwwroot: sin él, bucle de redirección.
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Restaurar un curso grande o reconstruir el índice de búsqueda supera
        # los 5 minutos: con 300s la petición se corta a la mitad del trabajo.
        proxy_connect_timeout  60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }
}

