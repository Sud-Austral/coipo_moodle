# ─────────────────────────────────────────────────────────────────────────────
# NOTA IMPORTANTE — Moodle tiene UNA sola URL
#
# $CFG->wwwroot es un valor único: Moodle no soporta responder en varias
# direcciones a la vez. Entrar por una URL distinta a la configurada provoca
# redirecciones al wwwroot, sesiones que se pierden o CSS que no carga. Por eso
# entrar por http://172.31.2.41/ responde 303 hacia academia.conaf.cl: es el
# comportamiento correcto, no un fallo del proxy.
#
# academia.conaf.cl NO existe todavía en el DNS de CONAF. Verificado el
# 30-07-2026 contra pimiento.conaf.cl (172.16.1.120): "Non-existent domain".
# Mientras el DNS no exista, en el equipo de trabajo, como administrador:
#
#   C:\Windows\System32\drivers\etc\hosts
#   172.31.2.41    academia.conaf.cl
#
# o bien lanzar el navegador con la resolución forzada, sin tocar el sistema:
#
#   msedge.exe --user-data-dir="%TEMP%\edge-test" ^
#              --host-resolver-rules="MAP academia.conaf.cl 172.31.2.41" ^
#              http://academia.conaf.cl
# ─────────────────────────────────────────────────────────────────────────────
